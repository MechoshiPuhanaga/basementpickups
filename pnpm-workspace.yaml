allowBuilds:
  esbuild: true

# Exact pins for security-sensitive transitive deps, matching the project's
# exact-version policy. The first group guards the build chain against
# resolution drift; the second group lifts transitive packages to their
# patched releases so `pnpm audit` stays clean. Bump deliberately.
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.23

overrides:
  esbuild: '0.28.2'
  js-yaml: '4.3.2'
  '@babel/core': '7.29.7'
  # audit pins (see `pnpm audit`)
  'brace-expansion@1': '1.1.18'
  'brace-expansion@>=3': '5.0.9'
  fast-uri: '3.1.7'
  browserslist: '4.28.9'
  baseline-browser-mapping: '2.11.23'
  qs: '6.16.0'
  body-parser: '2.3.0'
